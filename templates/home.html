<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content=
"width=device-width,
initial-scale=1.0">

<title>
Prediction
</title>

<style>

body{
    background:
    linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial;
}

.container{

    background:white;

    width:650px;

    padding:30px;

    border-radius:15px;

    box-shadow:
    0 0 20px rgba(
        0,0,0,0.3
    );
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
}

select,
input{

    width:100%;

    padding:12px;

    margin-top:8px;

    border-radius:8px;

    border:1px solid #ccc;
}

button{

    width:100%;

    padding:14px;

    border:none;

    background:#667eea;

    color:white;

    border-radius:8px;

    margin-top:20px;

    cursor:pointer;
}

.result{
    margin-top:20px;
    text-align:center;
    color:green;
    font-size:22px;
}

</style>

</head>

<body>

<div class="container">

<h1>
Student Exam
Performance
Indicator
</h1>

<form
action=
"{{ url_for('predict_datapoint') }}"
method="POST">

<label>
Gender
</label>

<select
name="gender"
required>

<option value="">
Select
</option>

<option value="male">
Male
</option>

<option value="female">
Female
</option>

</select>


<label>
Race or Ethnicity
</label>

<select
name="ethnicity"
required>

<option value="">
Select
</option>

<option value="group A">
Group A
</option>

<option value="group B">
Group B
</option>

<option value="group C">
Group C
</option>

<option value="group D">
Group D
</option>

<option value="group E">
Group E
</option>

</select>


<label>
Parental Level of Education
</label>

<select
name=
"parental_level_of_education"
required>

<option value="">
Select
</option>

<option value=
"associate's degree">
Associate's Degree
</option>

<option value=
"bachelor's degree">
Bachelor's Degree
</option>

<option value=
"high school">
High School
</option>

<option value=
"master's degree">
Master's Degree
</option>

<option value=
"some college">
Some College
</option>

<option value=
"some high school">
Some High School
</option>

</select>


<label>
Lunch Type
</label>

<select
name="lunch"
required>

<option value="">
Select
</option>

<option value=
"standard">
Standard
</option>

<option value=
"free/reduced">
Free/Reduced
</option>

</select>


<label>
Test Preparation Course
</label>

<select
name=
"test_preparation_course"
required>

<option value="">
Select
</option>

<option value="none">
None
</option>

<option value=
"completed">
Completed
</option>

</select>


<label>
Reading Score
</label>

<input
type="number"
name=
"reading_score"
min="0"
max="100"
required>


<label>
Writing Score
</label>

<input
type="number"
name=
"writing_score"
min="0"
max="100"
required>


<button
type="submit">

Predict Maths Score

</button>

</form>


<div class="result">

Predicted Maths Score:

{% if result %}
{{ result }}
{% endif %}

</div>

</div>

</body>
</html>
