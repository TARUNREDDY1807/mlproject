<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content=
          "width=device-width,
          initial-scale=1.0">

    <title>
        Student Performance
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .container{

            background:white;

            width:500px;

            padding:40px;

            border-radius:15px;

            text-align:center;

            box-shadow:
            0 0 20px rgba(
                0,0,0,0.3
            );
        }

        h1{
            margin-bottom:20px;
        }

        p{
            margin-bottom:30px;
        }

        .btn{
            display:inline-block;

            background:#667eea;

            color:white;

            text-decoration:none;

            padding:15px 30px;

            border-radius:8px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Student Exam
        Performance
        Indicator
    </h1>

    <p>
        Predict Student
        Maths Score
    </p>

    <a href="/predictdata"
       class="btn">

       Start Prediction

    </a>

</div>

</body>
</html>
